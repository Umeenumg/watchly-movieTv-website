
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#570c31;--red2:#8b1548;--red3:#c0305a;--dark:#03000a}
@keyframes f1{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-20px) rotate(-5deg)}}
@keyframes f2{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(-24px) rotate(8deg)}}
@keyframes f3{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(-2deg)}}
@keyframes f4{0%,100%{transform:translateY(0) rotate(10deg)}50%{transform:translateY(-22px) rotate(8deg)}}
@keyframes f5{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-18px) rotate(-10deg)}}
@keyframes f6{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-26px) rotate(7deg)}}
@keyframes f7{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(-6deg)}}
@keyframes f8{0%,100%{transform:translateY(0) rotate(14deg)}50%{transform:translateY(-20px) rotate(12deg)}}
@keyframes orbPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.75;transform:scale(1.15)}}
@keyframes orbPulse2{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.55;transform:scale(1.12)}}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spinR{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes titleReveal{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes scanline{0%{top:-4px}100%{top:100%}}
@keyframes glitch{0%,88%,100%{transform:none;clip-path:none}89%{clip-path:polygon(0 8%,100% 8%,100% 22%,0 22%);transform:translateX(-6px)}91%{clip-path:polygon(0 62%,100% 62%,100% 78%,0 78%);transform:translateX(6px)}93%{clip-path:none;transform:none}94%{clip-path:polygon(0 40%,100% 40%,100% 52%,0 52%);transform:translateX(-3px)}96%{clip-path:none;transform:none}}
@keyframes lineGrow{from{width:0;opacity:0}to{width:110px;opacity:1}}
@keyframes borderPulse{0%,100%{box-shadow:0 0 12px rgba(87,12,49,.5)}50%{box-shadow:0 0 30px rgba(87,12,49,.9),0 0 60px rgba(87,12,49,.4)}}
@keyframes particle{0%{transform:translateY(0) translateX(0);opacity:.9}100%{transform:translateY(-150px) translateX(var(--dx));opacity:0}}
@keyframes bgDrift{0%{transform:translateX(0) scale(1.05)}100%{transform:translateX(-50%) scale(1.05)}}

.wrap{position:relative;width:100%;height:560px;overflow:hidden;background:var(--dark);font-family:'Inter',sans-serif}

.bgstrip{position:absolute;inset:0;display:flex;width:200%;animation:bgDrift 50s linear infinite;opacity:.15}
.bgstrip img{flex-shrink:0;width:130px;height:100%;object-fit:cover;filter:blur(0.5px)}

.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(192,48,90,.2),transparent);animation:scanline 8s linear infinite;pointer-events:none;z-index:6}

.orb1{position:absolute;width:750px;height:750px;border-radius:50%;background:radial-gradient(circle,rgba(87,12,49,.55) 0%,rgba(87,12,49,.2) 40%,transparent 70%);top:50%;left:8%;transform:translate(-50%,-50%);animation:orbPulse 6s ease-in-out infinite;pointer-events:none;z-index:1}
.orb2{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(139,21,72,.45) 0%,transparent 70%);top:25%;left:85%;transform:translate(-50%,-50%);animation:orbPulse2 8s ease-in-out infinite 1s;pointer-events:none;z-index:1}
.orb3{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(192,48,90,.3) 0%,transparent 70%);top:90%;left:55%;transform:translate(-50%,-50%);animation:orbPulse 11s ease-in-out infinite 3s;pointer-events:none;z-index:1}

.rings{position:absolute;top:50%;left:50%;pointer-events:none;z-index:1}
.rg{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.rg1{width:820px;height:820px;border:1px solid rgba(87,12,49,.14);animation:spin 32s linear infinite}
.rg2{width:620px;height:620px;border:1px dashed rgba(139,21,72,.1);animation:spinR 22s linear infinite}
.rg3{width:420px;height:420px;border:1px solid rgba(192,48,90,.07);animation:spin 48s linear infinite}
.rg4{width:220px;height:220px;border:1px dashed rgba(87,12,49,.12);animation:spinR 14s linear infinite}

.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:50px 16px;z-index:2}

.p{position:relative;border-radius:12px;overflow:hidden;flex-shrink:0;cursor:pointer;transition:box-shadow .4s,transform .4s}
.p img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.23,1,.32,1),filter .5s}
.p:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 0 50px rgba(87,12,49,.8),0 0 100px rgba(87,12,49,.35),0 40px 80px rgba(0,0,0,.95) !important}
.p:hover img{filter:brightness(1.15) saturate(1.1)}
.pov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.15) 40%,transparent 65%)}
.shine{position:absolute;top:0;left:-140%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-15deg);transition:left .6s cubic-bezier(.23,1,.32,1);pointer-events:none}
.p:hover .shine{left:180%}
.pborder{position:absolute;inset:0;border-radius:12px;border:1px solid rgba(255,255,255,.07)}

.p1{width:114px;height:170px;animation:f1 5.2s ease-in-out infinite;box-shadow:0 28px 70px rgba(0,0,0,.92)}
.p2{width:130px;height:194px;animation:f2 6.1s ease-in-out infinite;box-shadow:0 32px 75px rgba(0,0,0,.92)}
.p3{width:108px;height:162px;animation:f3 7.3s ease-in-out infinite;box-shadow:0 26px 65px rgba(0,0,0,.9)}
.p4{width:148px;height:220px;animation:f4 5.6s ease-in-out infinite;box-shadow:0 40px 90px rgba(0,0,0,.96),0 0 50px rgba(87,12,49,.4);z-index:3}
.p5{width:120px;height:178px;animation:f5 6.8s ease-in-out infinite;box-shadow:0 30px 72px rgba(0,0,0,.92)}
.p6{width:112px;height:168px;animation:f6 4.9s ease-in-out infinite;box-shadow:0 28px 68px rgba(0,0,0,.9)}
.p7{width:132px;height:196px;animation:f7 7.5s ease-in-out infinite;box-shadow:0 34px 78px rgba(0,0,0,.92)}
.p8{width:106px;height:158px;animation:f8 5.9s ease-in-out infinite;box-shadow:0 26px 64px rgba(0,0,0,.9)}

.vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 50%,transparent 10%,rgba(3,0,10,.4) 52%,rgba(3,0,10,.97) 100%)}
.ftop{position:absolute;top:0;left:0;right:0;height:180px;background:linear-gradient(to bottom,rgba(3,0,10,.98),transparent);z-index:4;pointer-events:none}
.fbot{position:absolute;bottom:0;left:0;right:0;height:180px;background:linear-gradient(to top,rgba(3,0,10,.99),transparent);z-index:4;pointer-events:none}

.tline{position:absolute;top:0;left:0;right:0;height:3px;z-index:10;background:linear-gradient(90deg,transparent,var(--red) 25%,var(--red3) 50%,var(--red) 75%,transparent);animation:borderPulse 3s ease-in-out infinite}
.bline{position:absolute;bottom:0;left:0;right:0;height:3px;z-index:10;background:linear-gradient(90deg,transparent,var(--red) 25%,var(--red3) 50%,var(--red) 75%,transparent)}

.c{position:absolute;z-index:10}
.ctl{top:18px;left:18px;width:34px;height:34px;border-top:2px solid var(--red3);border-left:2px solid var(--red3)}
.ctr{top:18px;right:18px;width:34px;height:34px;border-top:2px solid var(--red3);border-right:2px solid var(--red3)}
.cbl{bottom:18px;left:18px;width:34px;height:34px;border-bottom:2px solid var(--red3);border-left:2px solid var(--red3)}
.cbr{bottom:18px;right:18px;width:34px;height:34px;border-bottom:2px solid var(--red3);border-right:2px solid var(--red3)}

.cnt{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;pointer-events:none}

.eye{display:flex;align-items:center;gap:10px;margin-bottom:16px;animation:fadeUp .6s ease both;pointer-events:auto}
.edot{width:8px;height:8px;border-radius:50%;background:var(--red3);box-shadow:0 0 12px var(--red3);animation:dotBlink 2s ease-in-out infinite;flex-shrink:0}
.etxt{font-size:9px;font-weight:700;letter-spacing:4px;color:var(--red3);text-transform:uppercase}
.esep{width:1px;height:14px;background:rgba(192,48,90,.35)}
.etxt2{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.32);text-transform:uppercase;font-weight:300}

.titles{margin-bottom:8px}
.t1{font-family:'Bebas Neue',Georgia,serif;font-size:90px;letter-spacing:5px;color:#fff;line-height:.88;animation:titleReveal .8s cubic-bezier(.23,1,.32,1) .1s both;text-shadow:0 0 100px rgba(87,12,49,.7)}
.t2{font-family:'Bebas Neue',Georgia,serif;font-size:90px;letter-spacing:5px;line-height:.88;background:linear-gradient(90deg,var(--red2),var(--red3),#e8608a,var(--red3),var(--red2));background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleReveal .8s cubic-bezier(.23,1,.32,1) .22s both,shimmer 4s linear 1s infinite}
.t3{font-family:'Bebas Neue',Georgia,serif;font-size:90px;letter-spacing:5px;color:#fff;line-height:.88;animation:titleReveal .8s cubic-bezier(.23,1,.32,1) .34s both;text-shadow:0 0 80px rgba(87,12,49,.5)}
.glitch{animation:glitch 11s ease-in-out 1s infinite}

.divrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:20px 0 15px;animation:fadeUp .6s ease .55s both}
.dl{height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:lineGrow .8s ease .65s both}
.diam{width:8px;height:8px;background:var(--red3);transform:rotate(45deg);box-shadow:0 0 12px var(--red3);flex-shrink:0}

.sub{font-size:11px;color:rgba(255,255,255,.36);letter-spacing:4px;text-transform:uppercase;font-weight:300;animation:fadeUp .6s ease .65s both;margin-bottom:30px}

.btns{display:flex;gap:18px;align-items:center;animation:fadeUp .6s ease .75s both;margin-bottom:30px;pointer-events:auto}
.bp{padding:15px 46px;font-size:11px;font-weight:800;letter-spacing:3px;color:#fff;text-transform:uppercase;cursor:pointer;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);background:linear-gradient(90deg,var(--red),var(--red2),var(--red3),var(--red2),var(--red));background-size:300% 100%;animation:shimmer 3s linear infinite;box-shadow:0 0 40px rgba(87,12,49,.75),0 0 80px rgba(87,12,49,.3)}
.bg2{padding:15px 36px;font-size:11px;font-weight:600;letter-spacing:3px;color:rgba(255,255,255,.6);text-transform:uppercase;cursor:pointer;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);border:1px solid rgba(87,12,49,.55);background:rgba(87,12,49,.1)}

.stats{display:flex;animation:fadeUp .6s ease .85s both;pointer-events:auto}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 26px}
.sn{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:1px;line-height:1}
.sl{font-size:7px;color:rgba(255,255,255,.22);letter-spacing:3px;text-transform:uppercase}
.sdiv{width:1px;height:44px;background:linear-gradient(to bottom,transparent,rgba(87,12,49,.7),transparent);align-self:center}

.particles{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.pt{position:absolute;border-radius:50%;animation:particle var(--d) ease-out var(--dl) infinite;opacity:0}
</style>

<div class="wrap">
  <div class="tline"></div>
  <div class="scan"></div>

  <div class="bgstrip" id="bgstrip"></div>

  <div class="orb1"></div><div class="orb2"></div><div class="orb3"></div>
  <div class="rings">

  <div class="stage">
    <div class="p p1">
      <img src="http://www.impawards.com/2025/posters/sinners_xlg.jpg" alt="Sinners" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#4a0a0a,#1a0303)'">

    <div class="p p2">
      <img src="http://www.impawards.com/tv/posters/stranger_things_ver5_xlg.jpg" alt="Stranger Things" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#080830,#020212)'">

    <div class="p p3">
      <img src="http://www.impawards.com/2025/posters/warfare_xlg.jpg" alt="Warfare" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#1c1c10,#080806)'">

    </div>
    <div class="p p5">
      <img src="http://www.impawards.com/2025/posters/zootopia_two_xlg.jpg" alt="Zootopia 2" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#1c0a30,#080214)'">
      <div class="pov"></div><div class="pborder"></div><div class="shine"></div>
    </div>
    <div class="p p6">
      <img src="http://www.impawards.com/2024/posters/moana_two_xlg.jpg" alt="Moana 2" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#063266,#020c22)'">
      <div class="pov"></div><div class="pborder"></div><div class="shine"></div>
    </div>
    <div class="p p7">
      <img src="http://www.impawards.com/2026/posters/bluff_xlg.jpg" alt="The Bluff" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#123422,#040e08)'">

    <div class="p p8">
      <img src="http://www.impawards.com/2026/posters/hoppers_xlg.jpg" alt="Hoppers" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(170deg,#321a08,#100602)'">
      <div class="pov"></div><div class="pborder"></div><div class="shine"></div>

  <div class="vig"></div><div class="ftop"></div><div class="fbot"></div>

  <div class="cnt">
    <div class="eye">
      <div class="edot"></div>

    <div class="stats">

      <div class="sdiv"></div>

</div>

<script>
const posters = [
  'http://www.impawards.com/2025/posters/sinners_xlg.jpg',
  'http://www.impawards.com/tv/posters/stranger_things_ver5_xlg.jpg',
  'http://www.impawards.com/2025/posters/warfare_xlg.jpg',
  'http://www.impawards.com/intl/uk/2025/posters/hamnet_xlg.jpg',
  'http://www.impawards.com/2025/posters/zootopia_two_xlg.jpg',
  'http://www.impawards.com/2024/posters/moana_two_xlg.jpg',
  'http://www.impawards.com/2026/posters/bluff_xlg.jpg',
  'http://www.impawards.com/2026/posters/hoppers_xlg.jpg'
];
const fallbacks = ['#4a0a0a','#080830','#1c1c10','#2e2208','#1c0a30','#063266','#123422','#321a08'];
const strip = document.getElementById('bgstrip');
[...posters,...posters,...posters].forEach((src,i)=>{
  const d = document.createElement('div');
  d.style.cssText=`flex-shrink:0;width:130px;height:560px;overflow:hidden;background:${fallbacks[i%8]}`;
  const img = document.createElement('img');
  img.style.cssText='width:100%;height:100%;object-fit:cover;opacity:.55';
  img.src = src;
  img.onerror = ()=>img.remove();
  d.appendChild(img);
  strip.appendChild(d);
});
const pc = document.getElementById('pts');
for(let i=0;i<22;i++){
  const p=document.createElement('div');
  p.className='pt';
  const dx=(Math.random()-.5)*140;
  const sz=1+Math.random()*3;
  p.style.cssText=`left:${15+Math.random()*70}%;bottom:${Math.random()*25}%;width:${sz}px;height:${sz}px;background:${Math.random()>.5?'#570c31':'#c0305a'};--dx:${dx}px;--d:${2.5+Math.random()*3.5}s;--dl:${Math.random()*5}s`;
  pc.appendChild(p);
}
</script>

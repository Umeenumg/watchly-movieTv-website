<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<header>
  <div class="header-container">

    <!-- Logo -->
      <a class="logo" href="home.html">
  <i class="bi bi-play-circle-fill"></i>
  <span class="logo-text">Watchly</span>
</a>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>

      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >

      <div id="search-suggestions" class="search-suggestions"></div>
    </div>

    <!-- Favorites -->
    <a class="watchlist-link favorites-link" href="favorites.html">
      <i class="bi bi-heart-fill"></i>
      <span class="watchlist-text">Favorites</span>
    </a>

    <!-- Watchlist -->
    <a class="watchlist-link" href="watchlist.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

  </div>
</header>

  <section class="favorites-page">
    <div class="favorites-header">
      <h1>My Favorites</h1>
      <span id="favorites-count"></span>
    </div>

    <div id="favorites-container" class="favorites-grid"></div>
  </section>

  <!-- Footer -->
 
<footer class="site-footer">
  <div class="footer-container">

    <div class="footer-top">
    <a class="logo" href="home.html">
      <i class="bi bi-play-circle-fill"></i>
      <span class="logo-text">Watchly</span>
    </a>
    </div>

    <div class="footer-links">
      <a href="home.html">Home</a>
      <a href="favorites.html">Favorites</a>
      <a href="watchlist.html">Watchlist</a>
    </div>

    <div class="footer-bottom">
      <p>Powered by TMDB API</p>
      <p>© 2026 EmyMovies</p>
    </div>

  </div>
</footer>

  <script src="js/favorites.js"></script>
  <script src="js/search.js"></script>
</body>
</html>

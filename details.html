<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>details</title>
  <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<body>
        <!-- Header Section -->
<header>
  <div class="header-container">

    <!-- Logo -->
    <a class="logo" href="home.html">
  <i class="bi bi-play-circle-fill"></i>
  <span class="logo-text">Watchly</span>
</a>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>

      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >

      <div id="search-suggestions" class="search-suggestions"></div>
    </div>

    <!-- Favorites -->
    <a class="watchlist-link favorites-link" href="favorites.html">
      <i class="bi bi-heart-fill"></i>
      <span class="watchlist-text">Favorites</span>
    </a>

    <!-- Watchlist -->
    <a class="watchlist-link" href="watchlist.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

  </div>
</header>

<section class="details-hero">
  <div class="details-overlay"></div>

  <div class="details-container">
    <div class="details-poster">
      <img id="details-poster" src="" alt="">
    </div>

    <div class="details-content">
      <h1 id="details-title">ONE PIECE</h1>

      <div class="details-meta-top">
        <span id="details-year">2023</span>
      </div>
      <div id="details-genres" class="genre-list"></div>
     <div class="details-actions">
  <button id="watchlist-btn" class="watchlist-btn">
    <i class="bi bi-bookmark-fill"></i>
    Add to Watchlist
  </button>

  <button id="favorite-btn" class="favorite-btn">
    <i class="bi bi-heart"></i>
    <span>Add to Favorites</span>
  </button>
</div>
      

      <div class="details-info-grid"></div>

      <div class="overview-box">
        <h2>Overview</h2>
        <p id="details-overview"></p>
      </div>
    </div>
  </div>
</section>
<section class="cast-section">
  <h2>Cast</h2>
  <div id="cast-list" class="cast-grid"></div>
</section>
<section class="media-reviews-section">
  <div class="media-column">

    <div class="trailer-box">
      <h2>Trailer</h2>
      <div id="trailer-container" class="trailer-container">
        <p class="trailer-placeholder">Loading trailer...</p>
      </div>
    </div>

    <div class="providers-box">
      <h2>Where to watch</h2>
      <div id="providers-container" class="providers-container">
        <p class="providers-placeholder">Loading providers...</p>
      </div>
      <div id="watch-now-wrapper"></div>
    </div>

  </div>

  <div class="reviews-column">
    <h2>Reviews</h2>
    <div id="reviews-list" class="reviews-mini-grid">
      <p class="reviews-placeholder">Loading reviews...</p>
    </div>
  </div>
</section>
<section class="recommended-section">
  <h2>Recommended for you</h2>
  <div id="recommended-list" class="similar-grid"></div>
</section>

<section class="similar-section">
  <h2>You may also like</h2>
  <div id="similar-list" class="similar-grid"></div>
</section>


 <!-- Footer -->
 
<footer class="site-footer">
  <div class="footer-container">

    <div class="footer-top">
    <a class="logo" href="home.html">
      <i class="bi bi-play-circle-fill"></i>
      <span class="logo-text">Watchly</span>
    </a>
    </div>

    <div class="footer-links">
      <a href="home.html">Home</a>
      <a href="favorites.html">Favorites</a>
      <a href="watchlist.html">Watchlist</a>
    </div>

    <div class="footer-bottom">
      <p>Powered by TMDB API</p>
      <p>© 2026 EmyMovies</p>
    </div>

  </div>
</footer>





  <script src="js/details.js"></script>
  <script src="js/search.js"></script>
</body>
</html>

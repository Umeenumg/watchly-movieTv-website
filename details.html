<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>details</title>
  <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<body>
        <!-- Header Section -->
<header>
  <div class="header-container">
    <!-- Logo -->
    <a class="logo" href="home.html">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">EmyMovies</span>
    </a>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>
      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >
    </div>

    <!-- Watchlist Button -->
    <a class="watchlist-link" href="watchlist.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

    <!-- Mobile Menu Button (hidden on desktop) -->
    <button class="mobile-menu-btn" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>

<section class="details-hero">
  <div class="details-overlay"></div>

  <div class="details-container">
    <div class="details-poster">
      <img id="details-poster" src="" alt="">
    </div>

    <div class="details-content">
      <h1 id="details-title">ONE PIECE</h1>

      <div class="details-meta-top">
        <span id="details-year">2023</span>
      </div>

      <div id="details-genres" class="genre-list"></div>
      <button id="watchlist-btn" class="watchlist-btn">
        <i class="bi bi-bookmark-fill"></i>
       Add to Watchlist
      </button>

      <div class="details-info-grid"></div>

      <div class="overview-box">
        <h2>Overview</h2>
        <p id="details-overview"></p>
      </div>
    </div>
  </div>
</section>
<section class="recommended-section">
  <h2>Recommended for you</h2>
  <div id="recommended-list" class="similar-grid"></div>
</section>

<section class="similar-section">
  <h2>You may also like</h2>
  <div id="similar-list" class="similar-grid"></div>
</section>






  <script src="details.js"></script>
  <script src="search.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>details</title>
  <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>
<body>
        <!-- Header Section -->
<header>
  <div class="header-container">
    <!-- Logo -->
    <a class="logo" href="home.html">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">EmyMovies</span>
    </a>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>
      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >
    </div>

    <!-- Watchlist Button -->
    <a class="watchlist-link" href="watchList.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

    <!-- Mobile Menu Button (hidden on desktop) -->
    <button class="mobile-menu-btn" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>

<section class="details-hero">
  <div class="container">
    <div class="poster">
      <div class="poster-img">
        <img id="detailsPoster" src="" alt="Movie Poster" class="poster-img">
      </div>

      <div class="poster-info">
        <h1 class="movie-title" id="detailsTitle">Title</h1>
        <span class="year" id="detailsYear">2026</span>

        <div class="meta" id="detailsGenres"></div>

        <div class="meta-details">
          <p><strong>Type:</strong> <span id="detailsType"></span></p>
          <p><strong>Language:</strong> <span id="detailsLanguage"></span></p>
          <p><strong>Rating:</strong> <span id="detailsRating"></span></p>
          <p><strong>Status:</strong> <span id="detailsStatus"></span></p>
          <p><strong>Extra:</strong> <span id="detailsExtra"></span></p>
        </div>

        <p class="tagline" id="detailsTagline"></p>

        <h4>Overview</h4>
        <p class="overview" id="detailsOverview"></p>
      </div>
    </div>
  </div>
</section>




  <script src="details.js"></script>
  <script src="search.js"></script>
</body>
</html>

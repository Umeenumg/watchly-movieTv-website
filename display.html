<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Bootstrap -->
  <title>displaySerch</title>
  
</head>

<body>
       <!-- Header Section -->
<header>
  <div class="header-container">

    <!-- Logo -->
     <a class="logo" href="home.html">
  <i class="bi bi-play-circle-fill"></i>
  <span class="logo-text">Watchly</span>
</a>
    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>

      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >

      <div id="search-suggestions" class="search-suggestions"></div>
    </div>

    <!-- Favorites -->
    <a class="watchlist-link favorites-link" href="favorites.html">
      <i class="bi bi-heart-fill"></i>
      <span class="watchlist-text">Favorites</span>
    </a>

    <!-- Watchlist -->
    <a class="watchlist-link" href="watchlist.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

  </div>
</header>


   <!-- display search results Section -->
<section class="filters-section">
  <div class="filters-top-row">
   <select id="media-filter">
    <option value="">All</option>
    <option value="movie">Movies</option>
    <option value="tv">TV Series</option>
  </select>

    <input type="number" id="year-filter" placeholder="Year">

    <select id="rating-filter">
      <option value="">All Ratings</option>
      <option value="9">9+ rating</option>
      <option value="8">8+ rating</option>
      <option value="7">7+ rating</option>
      <option value="6">6+ rating</option>
    </select>

    <select id="sort-filter">
      <option value="">Sort</option>
      <option value="vote_average.desc">Highest Rated</option>
      <option value="primary_release_date.desc">Newest</option>
    </select>

    <button id="apply-filters-btn">Apply</button>
  </div>

  <div class="genres-block">
    <div id="genres-checkboxes" class="genres-checkboxes"></div>
  </div>
</section>

 <section class="results-page">
  <h2 class="results-title">Search Results</h2>
  <div id="searchResults" class="results-list"></div>
</section>
<div class="pagination">
  <button id="prev-btn">Previous</button>
  <span id="page-info">Page 1</span>
  <button id="next-btn">Next</button>
</div>



/*Footer*/
 
<footer class="site-footer">
  <div class="footer-container">

    <div class="footer-top">
    <a class="logo" href="home.html">
      <i class="bi bi-play-circle-fill"></i>
      <span class="logo-text">Watchly</span>
    </a>
    </div>

    <div class="footer-links">
      <a href="home.html">Home</a>
      <a href="favorites.html">Favorites</a>
      <a href="watchlist.html">Watchlist</a>
    </div>

    <div class="footer-bottom">
      <p>Powered by TMDB API</p>
      <p>© 2026 EmyMovies</p>
    </div>

  </div>
</footer>

   <script src="js/display.js"></script>
   <script src="js/search.js"></script>
</body>
</html>

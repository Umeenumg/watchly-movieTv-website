<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    

    <!-- Bootstrap -->
  <title>displaySerch</title>
  
</head>

<body>
       <!-- Header Section -->
<header>
  <div class="header-container">
    <!-- Logo -->
    <a class="logo" href="home.html">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">EmyMovies</span>
    </a>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>
      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >
    </div>

    <!-- Watchlist Button -->
    <a class="watchlist-link" href="watchlist.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

    <!-- Mobile Menu Button (hidden on desktop) -->
    <button class="mobile-menu-btn" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>



   <!-- display search results Section -->
<section class="filters-section">
  <div class="filters-top-row">
   <select id="media-filter">
    <option value="">All</option>
    <option value="movie">Movies</option>
    <option value="tv">TV Series</option>
  </select>

    <input type="number" id="year-filter" placeholder="Year">

    <select id="rating-filter">
      <option value="">All Ratings</option>
      <option value="9">9+ rating</option>
      <option value="8">8+ rating</option>
      <option value="7">7+ rating</option>
      <option value="6">6+ rating</option>
    </select>

    <select id="sort-filter">
      <option value="">Sort</option>
      <option value="vote_average.desc">Highest Rated</option>
      <option value="primary_release_date.desc">Newest</option>
    </select>

    <button id="apply-filters-btn">Apply</button>
  </div>

  <div class="genres-block">
    <div id="genres-checkboxes" class="genres-checkboxes"></div>
  </div>
</section>

 <section class="results-page">
  <h2 class="results-title">Search Results</h2>
  <div id="searchResults" class="results-list"></div>
</section>
<div class="pagination">
  <button id="prev-btn">Previous</button>
  <span id="page-info">Page 1</span>
  <button id="next-btn">Next</button>
</div>





   <script src="display.js"></script>
   <script src="search.js"></script>
</body>
</html>

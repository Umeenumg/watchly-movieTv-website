<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
    <link rel="stylesheet" href="style.css">


  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
        <!-- Header Section -->
<header>
  <div class="header-container">
    <!-- Logo -->
    <a class="logo" href="home.html">
      <span class="logo-icon">🎬</span>
      <span class="logo-text">EmyMovies</span>
    </a>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="bi bi-search search-icon"></i>
      <input
        class="search-input"
        type="search"
        placeholder="Search for movies, series..."
        id="searchInput"
      >
    </div>

    <!-- Watchlist Button -->
    <a class="watchlist-link" href="watchlist.html">
      <i class="bi bi-bookmark-fill"></i>
      <span class="watchlist-text">Watchlist</span>
    </a>

    <!-- Mobile Menu Button (hidden on desktop) -->
    <button class="mobile-menu-btn" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>
<section class="watchlist-header">
  <h1>My Watchlist</h1>
  <div class="watchlist-controls">
    <span id="watchlist-count"></span>
    <button id="clear-watchlist">Clear All</button>
  </div>
</section>

<div id="watchlist-container" class="watchlist-container"></div>
  


<script src="watchlist.js"></script>

</body>
</html>
